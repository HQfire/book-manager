spring.application.name=book-manager

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/book_manager?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

app.jwt.secret=dev-only-secret-0123456789abcdefghijklmnopqrstuvwxyz-please-change
app.jwt.expiration-minutes=120
app.jwt.refresh-days=7

management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never

logging.level.root=INFO
logging.level.org.example.bookmanager=DEBUG
logging.pattern.level=%5p [%X{traceId:-}]
